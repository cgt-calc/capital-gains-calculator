name: Coverage comment

# Codecov's own pull request comment is cut down to a patch summary on the
# organisation's plan, so this posts a fuller one from Codecov's API as soon
# as its patch check reports. A check_run workflow always runs the copy on
# main, with the checkout below taking main too, so it never executes code
# from the pull request and is safe to give a token that can comment.
on:
  check_run:
    types:
      - completed

permissions: {}

# Keyed by the check as well as the commit: every app's check on a commit
# starts this workflow, and a run for another check must not cancel the one
# for Codecov's patch check.
concurrency:
  group: coverage-comment-${{ github.event.check_run.app.slug }}-${{ github.event.check_run.name }}-${{ github.event.check_run.head_sha }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post coverage comment
    # Every check from an app other than GitHub Actions starts this workflow;
    # only Codecov's patch check carries on. A fork has no bot key, so the
    # job is skipped there.
    if: >-
      github.repository_owner == 'cgt-calc' &&
      github.event.check_run.app.slug == 'codecov' &&
      github.event.check_run.name == 'codecov/patch'
    runs-on: ubuntu-latest
    # Reads only: the checkout, the open pull requests, their workflow runs
    # and Codecov's check on the commit. The comment is written with the
    # bot's token instead, so that it is the bot's and not GitHub Actions'.
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Create comment token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CGTBOT_CLIENT_ID }}
          private-key: ${{ secrets.CGTBOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
        run: python3 -m scripts.coverage_comment --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA"
