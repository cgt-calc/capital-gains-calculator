[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cgt-calc"
version = "0.0.0"
description = "Calculate UK capital gains tax from broker exports for your HMRC Self Assessment"
authors = [{ name = "Ruslan Sayfutdinov", email = "ruslan@sayfutdinov.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
keywords = [
  "capital gains tax",
  "UK",
  "tax calculator",
  "Charles Schwab",
  "Freetrade",
  "Trading 212",
  "Morgan Stanley",
  "Sharesight",
  "Hargreaves Lansdown",
  "Vanguard",
  "broker export",
  "financial reporting",
]
requires-python = ">=3.12"
dependencies = [
  "colorama>=0.4.6",
  "defusedxml>=0.7.1,<1.0.0",
  "Jinja2>=2.11.3,<4.0.0",
  "pandas>=3.0.5",
  "pdfplumber>=0.11.9",
  "requests>=2.27.1",
  "pyrate-limiter>=4.0.0",
  "yfinance>=1.7.0",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.2",
  "shtab>=1.12.1",
  # zoneinfo needs a tz database where the OS does not ship one.
  "tzdata>=2026.3; sys_platform == 'win32' or sys_platform == 'emscripten'",
]

[project.urls]
"Homepage" = "https://cgt-calc.uk"
"Repository" = "https://github.com/cgt-calc/capital-gains-calculator"
"Bug Tracker" = "https://github.com/cgt-calc/capital-gains-calculator/issues"
"Release Notes" = "https://github.com/cgt-calc/capital-gains-calculator/releases"

[project.scripts]
cgt-calc = "cgt_calc.cli:init"

[dependency-groups]
dev = [
  "codespell>=2.4.1",
  "dprint-py>=0.56.1.0",
  "harper-cli>=2.9.1",
  "mypy>=2.3.1",
  "packaging>=26.3",
  "pandas-stubs>=2.2",
  "pytest>=8.4.2,<10.0.0",
  "pytest-clarity>=1.0.1",
  "pytest-cov>=7.0.0",
  "pytest-env>=1.1.5",
  "pytest-xdist>=3.8.0",
  "reportlab>=5.0.1",
  "ruff>=0.16.5",
  "ty>=0.0.75,<0.1.0",
  "types-colorama>=0.4.15.20260508",
  "types-defusedxml>=0.7.0.20260504",
  "types-python-dateutil>=2.9.0.20250822",
  "types-reportlab>=4.5.1.20260827",
  "types-requests>=2.33.0.20260712",
]
docs = [
  "zensical>=0.0.57",
]
# Kept out of the dev group: the Linux wheel is large and only the link check
# job needs it.
links = [
  "lychee-bin>=0.24.2",
]

[tool.uv.build-backend]
module-root = "."

[tool.ruff]
required-version = ">=0.13.0"
target-version = "py312"

[tool.ruff.lint]
# Preview is on only to reach the individually selected preview rules below;
# explicit-preview-rules keeps the rest off, though preview may still sharpen
# what stable rules catch.
preview = true
explicit-preview-rules = true
select = [
  "A", # flake8-builtins
  "ARG", # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B", # flake8-bugbear
  "B909", # loop-iterator-mutation: mutating a collection while iterating it
  "BLE",
  "C", # complexity
  "COM", # flake8-commas
  "D", # pydocstyle
  "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
  "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
  "E", # pycodestyle
  "F", # pyflakes
  "FBT", # flake8-boolean-trap
  "FLY", # flynt
  "FURB", # refurb
  "G", # flake8-logging-format
  "I", # isort
  "INP", # flake8-no-pep420
  "ISC", # flake8-implicit-str-concat
  "ICN", # flake8-import-conventions
  "LOG", # flake8-logging
  "N", # pep8-naming
  "PD", # pandas-vet
  "PERF", # Perflint
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL", # pylint
  "PLR6201", # literal-membership: set literals for membership tests
  "PLW1514", # unspecified-encoding: locale-dependent IO broke Windows once
  "PLW1641", # eq-without-hash: __eq__ without __hash__ makes a class unhashable
  "PT", # flake8-pytest-style
  "PTH", # flake8-pathlib
  "PYI", # flake8-pyi
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # Ruff-specific
  "RUF031", # incorrectly-parenthesized-tuple-in-subscript
  "S102", # Use of exec detected
  "S103", # bad-file-permissions
  "S108", # hardcoded-temp-file
  "S306", # suspicious-mktemp-usage
  "S307", # suspicious-eval-usage
  "S313", # suspicious-xmlc-element-tree-usage
  "S314", # suspicious-xml-element-tree-usage
  "S315", # suspicious-xml-expat-reader-usage
  "S316", # suspicious-xml-expat-builder-usage
  "S317", # suspicious-xml-sax-usage
  "S318", # suspicious-xml-mini-dom-usage
  "S319", # suspicious-xml-pull-dom-usage
  "S601", # paramiko-call
  "S602", # subprocess-popen-with-shell-equals-true
  "S604", # call-with-shell-equals-true
  "S608", # hardcoded-sql-expression
  "S609", # unix-command-wildcard-injection
  "SIM", # flake8-simplify
  "SLF", # flake8-self
  "SLOT", # flake8-slots
  "T10", # flake8-debugger
  # "T20",    # flake8-print
  "TC", # flake8-type-checking
  "TID", # Tidy imports
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # pycodestyle
]

ignore = [
  "D202", # No blank lines allowed after function docstring
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
  "D406", # Section name should end with a newline
  "D407", # Section name underlining
  "E501", # line too long
  "PLC1901", # {existing} can be simplified to {replacement} as an empty string is falsey; too many false positives
  "PLR0911", # Too many return statements ({returns} > {max_returns})
  "PLR0912", # Too many branches ({branches} > {max_branches})
  "PLR0913", # Too many arguments to function call ({c_args} > {max_args})
  "PLR0917", # Too many positional arguments ({c_pos} > {max_pos})
  "PLR0915", # Too many statements ({statements} > {max_statements})
  "PLW2901", # Outer {outer_kind} variable {name} overwritten by inner {inner_kind} target
  "TRY003", # Avoid specifying long messages outside the exception class
  "TRY400", # Use `logging.exception` instead of `logging.error`
  "N817", # CamelCase {name} imported as acronym {short_name}

  # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191",
  "E111",
  "E114",
  "E117",
  "D206",
  "D300",
  "Q",
  "COM812",
  "COM819",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles intentionally mirror external library signatures (requests,
# yfinance, ...), so unused arguments there are expected, not bugs. Likewise,
# pytest parametrized cases routinely take boolean `expected` values (FBT).
"tests/**" = ["PLR2004", "ARG", "FBT"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
python_version = "3.12"
num_workers = 4
show_error_codes = true
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_no_return = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-iterable",
]

[tool.ty.environment]
python-platform = "all"

[tool.ty.rules]
blanket-ignore-comment = "error"

[tool.codespell]
quiet-level = 2
skip = "uv.lock,./.git/*,./.mypy_cache/*,./.pytest_cache/*,./.ruff_cache/*,./.venv/*,./dist/*,*.csv,./env/*,./out/*,./site/*,./.wrangler/*"

[tool.pytest.ini_options]
addopts = "-vv -n auto"
env = [
  "CGT_TEST_MODE = 1",
]
testpaths = [
  "tests",
]

[tool.coverage.run]
branch = true
# Measure CLI subprocesses spawned by the end-to-end tests too.
patch = ["subprocess"]
source = ["cgt_calc"]
# Store relative paths so reports are portable outside the
# environment that generated them.
relative_files = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
]
