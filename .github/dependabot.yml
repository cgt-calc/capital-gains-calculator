version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
  - package-ecosystem: github-actions
    directories:
      # Workflows in .github/workflows
      - "/"
      # Composite actions are not covered by "/" and must be listed explicitly
      - "/.github/actions/*"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    ignore:
      # The Python the image ships is chosen by hand. A bump to the next
      # minor version would otherwise be merged automatically.
      - dependency-name: "python"
