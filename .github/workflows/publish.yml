name: Publish to PyPI

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.12"

jobs:
  publish:
    name: Publish
    if: github.repository_owner == 'cgt-calc'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build takes its version from the release tag, so fetch the
          # tags along with the history.
          fetch-depth: 0

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build

      # A build that missed the tag, for example because the tag is not on
      # the checked-out commit, would be named after the previous release.
      - name: Check the build has the release's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # File names use the normalised version: v4.0.0-rc.1 builds as 4.0.0rc1.
          version="$(uv run python -c 'import os; from packaging.version import Version; print(Version(os.environ["TAG"]))')"
          ls dist
          test -f "dist/cgt_calc-${version}-py3-none-any.whl"
          test -f "dist/cgt_calc-${version}.tar.gz"

      - name: Publish to PyPI
        run: uv publish
