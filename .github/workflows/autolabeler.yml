name: Autolabel pull requests

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    name: Autolabeler
    if: github.repository_owner == 'cgt-calc'
    runs-on: ubuntu-latest
    steps:
      - name: Run release-drafter autolabeler
        uses: release-drafter/release-drafter/autolabeler@v7.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
