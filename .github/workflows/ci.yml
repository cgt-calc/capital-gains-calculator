name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup prek cache
        uses: ./.github/actions/prek-cache
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run prek on all files
        env:
          SKIP: pytest
        run: |
          uvx prek run --all-files --show-diff-on-failure --color=always

      - name: Run python-typing-update
        run: |
          uvx prek run --hook-stage manual python-typing-update --all-files --show-diff-on-failure --color=always

  tests:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # One job per extra OS is enough: platform breakage is about
          # OS APIs and encodings, not the Python minor version.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        env:
          CGT_TEST_MODE_STRICT: "1"
        run: uv run pytest -q --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        # Codecov merges the reports from all matrix jobs. Runs from
        # this repository authenticate with the token. Pull requests
        # from forks can't read secrets and fall back to tokenless
        # uploads, supported for public repositories.
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Don't fail CI on upload issues: merge protection comes
          # from the codecov/project status check, not this step.
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        # Upload also when tests fail: failed tests are the point.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: junit.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Run the built wheel in a clean environment
        # Catches runtime imports of packages which are only declared
        # as dev dependencies.
        run: uv run --isolated --no-project --with ./dist/*.whl -- cgt-calc --help

  markdown-link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Only the links dependency group is needed, so the full dev toolchain
      # is not installed here.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-suffix: ${{ github.job }}

      # Only successful checks are cached, so a broken link is re-checked on
      # every run and a fix is picked up immediately. actions/cache never
      # overwrites an existing key, so the key is unique per run and the most
      # recent cache is restored by prefix.
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      # Not one of the required status checks: broken links are reported
      # without blocking a merge.
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check_links.sh

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: local/cgt-calc:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the installed cgt-calc
        # The pytest step mounts the workspace over /build, which hides the
        # image's own install, so only this step runs what users get. It
        # runs as a non-root user, as the Docker docs tell Linux users to.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CGT_TEST_MODE_STRICT=1 \
            -v "${{ github.workspace }}:/data" \
            local/cgt-calc:test \
            -lc "cgt-calc --year 2022 --raw-file tests/raw/data/test_data.csv --no-balance-check --exchange-rates-file tests/exchange_rates_data.csv --output /tmp/report.pdf && test -s /tmp/report.pdf"

      - name: Run pytest inside container
        run: |
          docker run --rm \
            -e ENABLE_PDFLATEX=1 \
            -e CGT_TEST_MODE_STRICT=1 \
            -v "${{ github.workspace }}:/build" \
            local/cgt-calc:test \
            -lc "cd /build && uv run pytest -q --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy"

      - name: Upload coverage to Codecov
        # The only job running the test suite with pdflatex enabled.
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: docker
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        # Upload also when tests fail: failed tests are the point.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: junit.xml
          flags: docker
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload e2e tests outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs
          path: out/test-*
          # Long enough to look into a failed run, short of the 90-day default
          # that keeps every push's reports for a quarter.
          retention-days: 14
