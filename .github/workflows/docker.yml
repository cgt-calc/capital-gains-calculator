name: Publish Docker image

on:
  release:
    types: [published]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cgt-calc/capital-gains-calculator

jobs:
  build-amd64:
    name: Build amd64 image
    if: github.repository_owner == 'cgt-calc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history and tags, from which the image's build takes its
          # version: a release tag's own, or a post-release of it on main.
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Publish the runtime stage; the default test stage exists
          # for CI and includes uv.
          target: runtime
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-amd64
          cache-to: type=gha,mode=max,scope=publish-amd64

  build-arm64:
    name: Build arm64 image
    if: github.repository_owner == 'cgt-calc'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history and tags, from which the image's build takes its
          # version: a release tag's own, or a post-release of it on main.
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-arm64
          cache-to: type=gha,mode=max,scope=publish-arm64

  publish:
    name: Publish multi-arch manifest
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://github.com/cgt-calc/capital-gains-calculator/pkgs/container/capital-gains-calculator
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$IMAGE@${{ needs.build-amd64.outputs.digest }}" \
            "$IMAGE@${{ needs.build-arm64.outputs.digest }}"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "$IMAGE:$(jq -cr '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
