codecov:
  notify:
    # Wait for every job that measures coverage (Ubuntu on 3.13 and
    # 3.14, macOS, Windows and Docker) before setting statuses, so they
    # aren't computed from partial coverage.
    after_n_builds: 5

# Off: the coverage-comment workflow posts the PR comment instead.
# This also turns off Codecov's failed-test comment.
comment: false

# Path-based coverage views, shown in the PR comment and the Codecov
# UI. Display only: no per-component status checks.
component_management:
  individual_components:
    - component_id: core
      name: Core calculation
      paths:
        - cgt_calc/*.py
    - component_id: parsers
      name: Broker parsers
      paths:
        - cgt_calc/parsers/**
    - component_id: eri
      name: ERI importers
      paths:
        - cgt_calc/parsers/eri/**

coverage:
  status:
    project:
      default:
        # Compare against the base commit and fail when total coverage
        # drops by more than the threshold. Codecov does not post this
        # status on the organisation's current plan.
        target: auto
        threshold: 0.5%
    patch:
      default:
        # Fail when under 90% of the changed lines are covered. Not a
        # required check, so a late or missing Codecov status cannot
        # stall the merge queue. A pull request merged below the
        # target leaves a failing status on its commit on main.
        target: 90%

github_checks:
  # No per-line annotations in the diff view, the PR comment is enough.
  annotations: false
