# Repository labels, synced to GitHub by .github/workflows/manage-labels.yml on
# every push to main. The sync creates and updates the labels below and DELETES
# any repository label missing from this file, which also removes that label
# from every issue and pull request. Renaming an entry deletes the old label too,
# unless the entry names it in `from_name`.
#
# Release Drafter (.github/release-drafter.yml) and Dependabot
# (.github/dependabot.yml) use these labels by name. Check both before renaming
# or removing a label.
- name: breaking
  description: PR that breaks existing use of the CLI, input files or output; bumps the major version
  color: b60205

- name: bug
  description: Issue or PR about a wrong result or message, a crash, or a refusal of input that should work
  color: d73a4a

- name: code quality
  description: PR that improves code, messages or packaging without changing any calculated figure
  color: ef67c4

- name: dependencies
  description: PR that updates a dependency or the lock file; Dependabot adds it to its own PRs
  color: 0366d6

- name: documentation
  description: PR that changes only the docs site, the README or other documentation
  color: 0075ca

- name: feature
  description: Issue or PR for a new capability; a merged feature PR bumps the minor version
  color: a2eeef

- name: github structure
  description: PR that changes CI, GitHub workflows or actions, or the scripts and config they use
  color: "000000"

- name: help wanted
  description: Issue that needs outside help, such as a broker export sample or a contributor
  color: 008672

# major/minor/patch describe the dependency's version jump on Dependabot PRs.
# Dependabot adds them itself: nothing in this repository applies them. They do
# not affect this project's version: release bumps are driven by the "breaking"
# and "feature" labels, see release-drafter.yml.
- name: major
  description: Added by Dependabot to a semver-major dependency update; does not set the release version
  color: 16970B

- name: minor
  description: Added by Dependabot to a semver-minor dependency update; does not set the release version
  color: 16970B

- name: patch
  description: Added by Dependabot to a semver-patch dependency update; does not set the release version
  color: 16970B

- name: performance
  description: PR that makes a run, install or Docker image faster or smaller, with results unchanged
  color: "016175"

- name: skip-release
  description: PR to leave out of the release notes entirely
  color: "000000"

- name: question
  description: Issue asking how to use cgt-calc or read its output, rather than reporting a fault
  color: d876e3

- name: removal
  description: PR that removes or deprecates a feature, option or supported input
  color: 9ae7ea

- name: testing
  description: PR that only adds or changes tests, fixtures or the coverage check
  color: b1fc6f
