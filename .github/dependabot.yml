version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    ignore:
      # The build backend, hatchling, is required with no upper bound
      # from the oldest release that writes our licence as PEP 639
      # metadata. Dependabot would raise that floor to each new
      # release, as it did for uv_build, which changes nothing here and
      # would only stop builds where a distribution packages an older
      # hatchling.
      - dependency-name: "hatchling"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
  - package-ecosystem: github-actions
    directories:
      # Workflows in .github/workflows
      - "/"
      # Composite actions are not covered by "/" and must be listed explicitly
      - "/.github/actions/*"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
    ignore:
      # The Python the image ships is chosen by hand. A bump to the next
      # minor version would otherwise be merged automatically.
      - dependency-name: "python"
