name: Docs

# Pushes to main publish the unreleased docs to next.cgt-calc.uk. Releases
# publish their own docs to cgt-calc.uk through release-docs.yml.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      - ".github/actions/build-docs/**"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build docs
        uses: ./.github/actions/build-docs
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          next: "true"

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          if-no-files-found: error

      - name: Upload docs digest
        uses: actions/upload-artifact@v7
        with:
          name: docs-digest
          path: digest.txt
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.repository_owner == 'cgt-calc'
    needs: build
    runs-on: ubuntu-latest
    concurrency: docs-next-deploy
    environment:
      name: docs-next
      url: https://next.cgt-calc.uk
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=cgt-calc --branch=next --commit-dirty=true
