codecov:
  notify:
    # Wait for every job that measures coverage (Ubuntu on 3.13 and
    # 3.14, macOS, Windows and Docker) before setting statuses, so they
    # aren't computed from partial coverage.
    after_n_builds: 5

comment:
  after_n_builds: 5
  layout: "reach, diff, flags, components, files"

# Path-based coverage views, shown in the PR comment and the Codecov
# UI. Display only: no per-component status checks.
component_management:
  individual_components:
    - component_id: core
      name: Core calculation
      paths:
        - cgt_calc/*.py
    - component_id: parsers
      name: Broker parsers
      paths:
        - cgt_calc/parsers/**
    - component_id: eri
      name: ERI importers
      paths:
        - cgt_calc/parsers/eri/**

coverage:
  status:
    project:
      default:
        # Compare against the base commit and block PRs that decrease
        # total coverage by more than the threshold.
        target: auto
        threshold: 0.5%
    patch:
      default:
        # Report coverage of changed lines without blocking the merge.
        informational: true

github_checks:
  # No per-line annotations in the diff view, the PR comment is enough.
  annotations: false
