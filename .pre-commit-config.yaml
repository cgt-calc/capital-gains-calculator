# The bundled fonts and their licence ship exactly as published, so no hook
# rewrites them (the licence has trailing spaces).
exclude: ^cgt_calc/resources/fonts/
repos:
  # First: it puts back the files it leaves alone from the index, which would
  # undo a fix an earlier hook made, and the hooks after it, ruff among them,
  # format what it rewrites.
  - repo: https://github.com/cdce8p/python-typing-update
    rev: v0.9.0
    hooks:
      - id: python-typing-update
        # A wrapper, so that it can run on a commit: see the script.
        entry: scripts/run_python_typing_update.sh
        args:
          - --py312-plus
          - --force
          - --keep-updates
        files: ^.+\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
  - repo: local
    hooks:
      - id: codespell
        name: codespell
        entry: uv run codespell --write-changes
        language: system
        pass_filenames: false
      - id: harper
        name: harper grammar check
        entry: scripts/run_harper.sh
        language: script
        files: ^(cgt_calc/.*\.py|.*\.md)$
      - id: dprint
        name: dprint format
        language: system
        entry: uv run dprint fmt
        pass_filenames: false
        types_or:
          - dockerfile
          - json
          - markdown
          - toml
          - yaml
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy cgt_calc tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check cgt_calc tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        language: system
        entry: env CGT_TEST_MODE_STRICT=1 uv run pytest
        pass_filenames: false
