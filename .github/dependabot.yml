version: 2
# The cooldown in each entry makes Dependabot wait at least 7 days after a
# release before opening a version update for it, so a compromised release
# has time to be found and pulled first. Security updates are not delayed.
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    ignore:
      # The build backend, hatchling, is required with no upper bound
      # from the oldest release that writes our licence as PEP 639
      # metadata. Dependabot would raise that lower bound to each new
      # release, as it did for uv_build. A higher lower bound changes
      # nothing for our builds, which already get the newest hatchling,
      # and would only break builds in distributions that ship an older
      # one.
      - dependency-name: "hatchling"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
  - package-ecosystem: github-actions
    directories:
      # Workflows in .github/workflows
      - "/"
      # Composite actions are not covered by "/" and must be listed explicitly
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    ignore:
      # The Python the image ships is chosen by hand. A bump to the next
      # minor version would otherwise be merged automatically.
      - dependency-name: "python"
